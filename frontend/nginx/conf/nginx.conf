worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 3002;
        server_name 172.16.1.17;

        root html;
        index index.html;

        # ======================
        # FRONTEND (React)
        # ======================
        location /template/ {
            try_files $uri $uri/ /template/index.html;
        }

        # ======================
        # BACKEND (Node / Express)
        # ======================
        location /template/api/ {
            proxy_pass http://172.16.1.17:3003/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root C:/Users/alexandra.anchondo/Documents/Github/ControlInventarios/frontend/nginx/html;
        }
    }
}
